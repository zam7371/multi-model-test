<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-model live</title>
<style>
  :root { --bg:#111214; --panel:#1a1c1f; --line:#2a2d32; --text:#e6e7e9; --mute:#8b9099; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 var(--mono); padding:20px; }
  h1 { font-size:15px; letter-spacing:.08em; text-transform:uppercase; margin:0 0 10px; }
  #q { display:flex; gap:12px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:14px; }
  #q .lbl { color:var(--mute); }
  #q .txt { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #chip { padding:2px 10px; border-radius:99px; border:1px solid var(--line); color:var(--mute); }
  #chip.on { color:#111; background:#fbbf24; border-color:#fbbf24; }
  #conn { color:var(--mute); font-size:12px; margin-bottom:6px; }
  svg { width:100%; height:auto; display:block; background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  svg text { font-family:var(--mono); }
  .box { fill:#15171a; stroke-width:2; }
  .box.idle { opacity:.6; }
  .box.on { animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { stroke-opacity:.35; } }
  .flow { stroke-dasharray:7 7; animation:dash .6s linear infinite; }
  @keyframes dash { to { stroke-dashoffset:-14; } }
  #log { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin-top:14px; min-height:120px; }
  #log div { padding:1px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #log .t { color:var(--mute); margin-right:10px; }
</style>
</head>
<body>
<h1>3 models &middot; 1 session &middot; live</h1>
<div id="conn">menyambung ke server...</div>
<div id="q"><span class="lbl">SOALAN</span><span class="txt" id="qtxt">(belum ada soalan)</span><span id="chip">menunggu</span></div>
<svg id="svg" viewBox="0 0 1000 470"></svg>
<div id="log"></div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const COLORS = { haiku: '#2dd4bf', sonnet: '#fbbf24', opus: '#a78bfa' };
const colorOf = (m) => COLORS[(m || '').toLowerCase()] || '#94a3b8';
const isTask = (e) => e.tool === 'Task' || e.tool === 'Agent';
const isHand = (p) => /agent-message|hand-back/i.test(p || '');
const clip = (s, n) => (s && s.length > n ? s.slice(0, n - 1) + '…' : s || '');

const S = { title: '', main: { active: false, text: 'menunggu soalan', since: 0, model: 'sonnet' }, agents: new Map(), log: [], t0: 0, off: 0, dirty: true };

function agent(name, model) {
  if (!S.agents.has(name)) { S.agents.set(name, { name, model: model || '', calls: 0, active: 0, text: '', since: 0 }); S.dirty = true; }
  const a = S.agents.get(name);
  if (model && !a.model) { a.model = model; S.dirty = true; }
  return a;
}
function addLog(ts, text) {
  S.log.push({ ts, text });
  if (S.log.length > 200) S.log.shift();
}
function resetQuestion(ts, title) {
  for (const a of S.agents.values()) { a.calls = 0; a.active = 0; a.text = ''; a.since = 0; }
  S.log = []; S.t0 = ts; S.title = title;
}
const anyActive = () => [...S.agents.values()].some((a) => a.active > 0);
const latestActive = () => [...S.agents.values()].filter((a) => a.active > 0).sort((a, b) => b.since - a.since)[0];

function apply(e) {
  if (!e || !e.ts) return;
  if (e.event === 'UserPromptSubmit') {
    if (S.main.active) return; // subagents also fire this
    if (!isHand(e.prompt)) resetQuestion(e.ts, e.prompt || '');
    S.main.active = true; S.main.since = e.ts;
    S.main.text = isHand(e.prompt) ? 'menerima hasil subagent' : 'membaca soalan';
    addLog(e.ts, isHand(e.prompt) ? '← hand-back diterima' : 'soalan diterima');
  } else if (e.event === 'Stop') {
    if (!S.main.active) return;
    S.main.active = false;
    S.main.text = anyActive() ? 'menunggu subagent' : 'selesai';
    addLog(e.ts, 'sonnet berhenti: ' + S.main.text);
  } else if (e.event === 'PreToolUse' && isTask(e)) {
    const a = agent(e.agent || 'subagent', e.model);
    a.calls++; a.active++; a.since = e.ts; a.text = e.desc || 'bekerja';
    addLog(e.ts, '-> delegating to ' + a.name + ': ' + (e.desc || ''));
  } else if (e.event === 'SubagentStop') {
    const a = (e.agent && S.agents.get(e.agent)) || [...S.agents.values()].find((x) => x.active > 0);
    if (a && a.active > 0) {
      a.active--;
      if (a.active === 0) a.text = 'selesai';
      addLog(e.ts, '← ' + a.name + ' selesai (' + ((e.ts - a.since) / 1000).toFixed(1) + 's)');
    }
  } else if (e.event === 'PreToolUse') {
    const step = (e.tool || 'tool') + (e.detail ? ' ' + e.detail : '');
    let a = e.agent && S.agents.get(e.agent);
    if (!a && !S.main.active) a = latestActive(); // tool call by a running subagent
    if (a) a.text = step; else { S.main.text = step; }
    addLog(e.ts, (a ? a.name : 'sonnet') + ': ' + clip(step, 70));
  }
}

// ---------- drawing ----------
const svg = document.getElementById('svg');
let boxes = new Map(), mainBox = null;
function el(tag, attrs, text) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs || {}) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}
function makeBox(x, y, w, h, title) {
  const g = el('g');
  const r = el('rect', { x, y, width: w, height: h, rx: 12, class: 'box idle' });
  const t = el('text', { x: x + 16, y: y + 30, fill: '#e6e7e9', 'font-size': 18, 'font-weight': 700 }, title);
  const m = el('text', { x: x + 16, y: y + 52, 'font-size': 12 });
  const b = el('text', { x: x + w - 16, y: y + 30, 'font-size': 12, 'text-anchor': 'end' });
  const c = el('text', { x: x + 16, y: y + h - 48, fill: '#8b9099', 'font-size': 12 });
  const d = el('text', { x: x + 16, y: y + h - 22, fill: '#e6e7e9', 'font-size': 13 });
  const tm = el('text', { x: x + w - 16, y: y + h - 48, fill: '#8b9099', 'font-size': 12, 'text-anchor': 'end' });
  g.append(r, t, m, b, c, d, tm);
  svg.append(g);
  return { r, t, m, b, c, d, tm, w };
}
function layout() {
  svg.replaceChildren(); boxes = new Map();
  const names = [...S.agents.keys()], n = Math.max(names.length, 1);
  const bw = Math.min(290, (960 - (n - 1) * 30) / n), total = n * bw + (n - 1) * 30, x0 = (1000 - total) / 2;
  const mx = 350, mw = 300, my = 20, mh = 150;
  names.forEach((nm, i) => {
    const cx = x0 + i * (bw + 30) + bw / 2;
    const ln = el('path', { d: `M500 ${my + mh} C 500 230, ${cx} 230, ${cx} 270`, fill: 'none', stroke: '#2a2d32', 'stroke-width': 3 });
    svg.append(ln);
    boxes.set(nm, { line: ln });
  });
  mainBox = makeBox(mx, my, mw, mh, 'main session');
  names.forEach((nm, i) => {
    const bx = makeBox(x0 + i * (bw + 30), 270, bw, 170, nm);
    Object.assign(boxes.get(nm), bx);
  });
  S.dirty = false;
}
function paint(bx, color, on, state, model, calls, desc, since, now) {
  bx.r.setAttribute('stroke', color);
  bx.r.setAttribute('class', 'box ' + (on ? 'on' : 'idle'));
  bx.r.style.filter = on ? `drop-shadow(0 0 10px ${color})` : 'none';
  bx.m.setAttribute('fill', color); bx.m.textContent = model;
  bx.b.setAttribute('fill', on ? color : '#8b9099'); bx.b.textContent = state;
  bx.c.textContent = calls;
  bx.d.textContent = clip(desc, Math.floor((bx.w - 32) / 8));
  bx.tm.textContent = on && since ? ((now - since) / 1000).toFixed(0) + 's' : '';
}
function draw() {
  if (S.dirty) layout();
  const now = Date.now();
  const mOn = S.main.active;
  paint(mainBox, colorOf('sonnet'), mOn, mOn ? 'awake' : (anyActive() ? 'menunggu' : 'rehat'), 'sonnet', '', S.main.text, S.main.since, now);
  for (const a of S.agents.values()) {
    const bx = boxes.get(a.name); if (!bx) continue;
    const on = a.active > 0, col = colorOf(a.model);
    paint(bx, col, on, on ? 'awake' : 'asleep', a.model || '?', 'panggilan: ' + a.calls, a.text || '—', a.since, now);
    bx.line.setAttribute('stroke', on ? col : '#2a2d32');
    bx.line.setAttribute('class', on ? 'flow' : '');
  }
  const chip = document.getElementById('chip');
  const busy = mOn || anyActive();
  chip.textContent = busy ? 'memproses' : (S.title ? 'siap' : 'menunggu');
  chip.className = busy ? 'on' : '';
  document.getElementById('qtxt').textContent = S.title || '(belum ada soalan)';
  const lg = document.getElementById('log'); lg.replaceChildren();
  for (const l of S.log.slice(-14).reverse()) {
    const d = document.createElement('div'), t = document.createElement('span');
    t.className = 't'; t.textContent = '+' + ((l.ts - S.t0) / 1000).toFixed(1) + 's';
    d.append(t, document.createTextNode(l.text)); lg.append(d);
  }
}

// ---------- polling ----------
async function poll() {
  const conn = document.getElementById('conn');
  try {
    const j = await (await fetch('/__events?from=' + S.off, { cache: 'no-store' })).json();
    if (j.reset) { S.agents.forEach((a) => { a.calls = 0; a.active = 0; a.text = ''; }); S.log = []; S.title = ''; S.main.active = false; }
    S.off = j.next;
    for (const line of j.text.split('\n')) { if (!line.trim()) continue; try { apply(JSON.parse(line)); } catch (_) {} }
    conn.textContent = 'tersambung · memantau .claude/logs/events.jsonl';
  } catch (_) { conn.textContent = 'tidak dapat sambung ke server. Jalankan: node viewer/server.js'; }
}
async function init() {
  try { for (const a of await (await fetch('/__agents')).json()) agent(a.name, a.model); } catch (_) {}
  if (!S.agents.size) agent('repo-crawler', 'haiku'), agent('reviewer', 'opus');
  layout(); draw(); await poll(); draw();
  setInterval(async () => { await poll(); }, 700);
  setInterval(draw, 250);
}
init();
</script>
</body>
</html>
